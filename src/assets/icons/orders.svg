<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <!-- Ombre portée subtile pour imiter le relief de l'image -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#002b18" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)" fill="none" stroke="#0b4528" stroke-linecap="round" stroke-linejoin="round">
    <!-- Contour de la page -->
    <rect x="5" y="3" width="14" height="18" rx="2" stroke-width="1.5" fill="#f0f5f2"/>
    
    <!-- Lignes de texte intérieures -->
    <line x1="8.5" y1="8" x2="15.5" y2="8" stroke-width="1.5"/>
    <line x1="8.5" y1="12" x2="15.5" y2="12" stroke-width="1.5"/>
    <line x1="8.5" y1="16" x2="13" y2="16" stroke-width="1.5"/>
  </g>
</svg>
